[project]
name = "adaptive-troubleshooting-runtime"
version = "2.2.0"
description = "A local system-understanding-first SRE diagnostic runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0.2,<7",
  "langgraph>=0.2.60,<2",
  "litellm>=1.55,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "paramiko>=3.5,<5",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-java==0.23.5",
  "tree-sitter-c==0.24.1",
  "tree-sitter-cpp==0.23.4",
  "Pillow==12.3.0",
  "pypdfium2==5.14.0",
  "rapidocr-onnxruntime==1.4.4; python_version < '3.13'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[dependency-groups]
dev = ["pytest>=8,<10", "docker>=7.1,<8", "playwright>=1.50,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
