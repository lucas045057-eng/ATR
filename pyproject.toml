[project]
name = "adaptive-troubleshooting-runtime"
version = "0.1.0"
description = "A local system-understanding-first SRE diagnostic runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0.2,<7",
  "langgraph>=0.2.60,<2",
  "litellm>=1.55,<2",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
