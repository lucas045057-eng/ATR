name: ATR validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXTERNAL_MODEL_ENABLED: "false"
      SSH_ENABLED: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.12.24
      - run: uv sync --locked --group dev
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: npm ci && npm run build
        working-directory: frontend
      - run: uv run --locked python -m playwright install --with-deps chromium
      - run: |
          mkdir -p test-results
          uv run --locked pytest -q --basetemp=test-results/ci-temp --junitxml=test-results/ci.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-test-results
          path: test-results/ci.xml
          if-no-files-found: warn
