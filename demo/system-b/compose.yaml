name: atr-system-b
services:
  postgres_store:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: demo-inventory-secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/010-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 4s
      timeout: 3s
      retries: 20
      start_period: 8s
    networks: [system-b-internal]
  catalog_api:
    build: .
    environment:
      PGHOST: postgres_store
      PGDATABASE: inventory
      PGUSER: inventory
      PGPASSWORD: demo-inventory-secret
      PGPORT: "5432"
    depends_on:
      postgres_store:
        condition: service_healthy
    networks: [system-b-internal]
  ingress_proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [catalog_api]
    ports:
      - "127.0.0.1:18081:80"
    networks: [system-b-internal, atr-runtime]
networks:
  system-b-internal:
    internal: true
  atr-runtime:
    external: true
    name: atr_runtime
volumes:
  postgres-data:
